<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KPOPZOO Desktop Pets</title>
    <meta
      name="description"
      content="KPOPZOO 桌宠合集下载页，集中下载 Windows 与 macOS 版本。"
    >
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=20260813-mailbox-modal">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/home" aria-label="KPOPZOO 首页">
        <span class="brand-mark" data-site-broccoli aria-hidden="true">🥦</span>
        <span>
          <strong>KPOPZOO</strong>
          <small>Desktop Pets</small>
        </span>
      </a>
      <nav class="top-nav" aria-label="页面导航">
        <button class="nav-button" type="button" id="mailboxButton">留言板</button>
      </nav>
    </header>

    <main id="appRoot" class="app-root" aria-live="polite">
    </main>

    <dialog class="message-dialog" id="messageDialog" aria-labelledby="dialogTitle">
      <div class="dialog-card">
        <button class="dialog-close" type="button" id="dialogClose" aria-label="关闭弹窗">×</button>
        <p class="dialog-title" id="dialogTitle">提示</p>
        <p class="dialog-body" id="dialogBody">请查看说明。</p>
        <div class="dialog-actions" id="dialogActions"></div>
      </div>
    </dialog>

    <dialog class="usage-dialog" id="usageDialog" aria-labelledby="usageDialogTitle">
      <div class="usage-dialog-card">
        <button class="dialog-close" type="button" id="usageDialogClose" aria-label="关闭弹窗">×</button>
        <p class="dialog-title" id="usageDialogTitle">使用说明</p>
        <article class="usage-dialog-body" id="usageDialogBody"></article>
      </div>
    </dialog>

    <script src="app.js?v=20260813-mailbox-modal"></script>
  </body>
</html>
